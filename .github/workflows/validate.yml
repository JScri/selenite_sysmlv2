name: model
on: [push, pull_request]

# The SysML v2 project lives in a subfolder of this repository; every step
# runs there. Restored Wave 2 from Jason's original workflow (which assumed
# the model folder was the repository root).
# sysml-diagram is pinned to 0.42.0 (Wave 4A, 6 Nov 2026): 0.54.0 rejects the
# Wave 3 gate-binding idiom (SSM079 on 'attribute redefines x = gates.y.derivedPhase')
# that sysml-validate 0.36.0 accepts; W4A-N2.
defaults:
  run:
    working-directory: selenite-sysml-wave1-revC/selenite-sysml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install SysML v2 CLI tools
        run: npm install -g sysml-validate@0.36.0 sysml-diagram@0.42.0
      - name: Validate model
        run: sysml-validate model --workspace . --all --format github
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Connection endpoints resolve (Wave 4B, W4B-N2)
        run: python3 tools/connect_check.py
      - name: Render diagrams
        run: bash tools/render_diagrams.sh
      - name: Upload diagrams
        uses: actions/upload-artifact@v4
        with:
          name: diagrams
          path: selenite-sysml-wave1-revC/selenite-sysml/diagrams/*.svg

  compute:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install selenite-compute
        run: pip install -e "selenite-compute[test]"
      - name: Golden regression suite (1,437 rows + console captures)
        run: pytest selenite-compute -q -rs
      - name: Plan check (derived-vs-declared register, Wave 3)
        run: python selenite-sysml-wave1-revC/selenite-sysml/tools/plan_check.py --markdown plan_register.md --quiet
      - name: Upload plan register
        uses: actions/upload-artifact@v4
        with:
          name: plan-register
          path: plan_register.md
      - name: Scenario check (decisions under uncertainty, Wave 4A)
        run: python selenite-sysml-wave1-revC/selenite-sysml/tools/scenario_check.py --n 500 --seed 20260920 --markdown scenario_register.md --quiet
      - name: Upload scenario register
        uses: actions/upload-artifact@v4
        with:
          name: scenario-register
          path: scenario_register.md
